## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=6.0.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/jsmn: ^1.1.0

  # ===== 以下组件来自同一仓库 wireless-power-components =====
  # git 地址与提交版本通过 YAML 锚点统一定义，升级时只需修改下面第一处 version。
  diagnostic_log:
    git: &wireless_power_components_repo https://github.com/qingmeijiupiao/wireless-power-components.git
    path: components/common/diagnostic_log
    version: &wireless_power_components_version 0bb4113e313d0c600c006329db920e6d0fdd6aac
  HXC_TWAI:
    git: *wireless_power_components_repo
    path: components/bsp/HXC_TWAI
    version: *wireless_power_components_version
